name: Release

# Velopack packages for Windows can only be produced on Windows — the Linux vpk build ships
# nothing but the AppImage packer — so this runs on a Windows runner.
#
# Every push to main that touches the application ships a release, so a running copy offers the
# update on its next launch with nothing further to do. Version numbers come from nbgv (git
# height), so no tagging is needed; pushing an explicit vX.Y.Z tag also works and wins over the
# computed version. Documentation-only pushes are skipped — there is nothing in them to install.
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish
    if: github.repository_owner == 'mouseling'   # packId below is tied to this owner
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # nbgv needs the full history to compute a version

      - name: Get version info
        uses: dotnet/nbgv@master
        id: nbgv

      - name: Resolve release version
        # Normally nbgv supplies the version, derived from version.json plus commit height, and
        # vpk creates the matching tag — so pushing to main is all that is needed. If someone
        # does push an explicit vX.Y.Z tag, that wins: nbgv's computed version would not match
        # it, and the release would otherwise be published under a different tag than the one
        # that triggered the run, stranding the original.
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $v = "${{ steps.nbgv.outputs.SemVer2 }}"
          }
          Write-Host "release version: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Publish
        # No credentials are needed anywhere here: the repository is public, so the shipped app
        # reads its own releases anonymously and nothing has to be embedded in the binary.
        run: |
          dotnet publish src/Vcm.App/Vcm.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            /p:Version=${{ steps.ver.outputs.version }} `
            /p:FileVersion=${{ steps.nbgv.outputs.AssemblyFileVersion }} `
            /p:AssemblyVersion=${{ steps.nbgv.outputs.AssemblyVersion }} `
            -o out

      - name: Sanity check the VLC payload
        # Single-file publishing silently hides these DLLs inside the exe and playback dies while
        # the app still starts. Fail the release here rather than ship a player that cannot decode.
        shell: pwsh
        run: |
          $plugins = (Get-ChildItem -Recurse out/libvlc/win-x64/plugins -Filter *.dll -ErrorAction SilentlyContinue).Count
          $core    = (Get-ChildItem out/libvlc/win-x64/libvlc*.dll -ErrorAction SilentlyContinue).Count
          Write-Host "libvlc core dlls: $core, plugins: $plugins"
          if ($core -lt 2 -or $plugins -lt 100) { throw "libvlc payload missing - refusing to release" }

      - name: Download previous releases
        continue-on-error: true   # expected to fail on the very first release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "$env:GITHUB_TOKEN"

      - name: Pack
        run: |
          vpk pack `
            --packId github.mouseling.videocollection `
            --packVersion "${{ steps.ver.outputs.version }}" `
            --packDir "out" `
            --mainExe "VideoCollectionManager.exe" `
            --packTitle "Video Collection Manager" `
            --packAuthors "mouseling"

      - name: Upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --publish `
            --releaseName "v${{ steps.ver.outputs.version }}" `
            --tag "v${{ steps.ver.outputs.version }}" `
            --targetCommitish "${{ github.sha }}" `
            --token "$env:GITHUB_TOKEN"
